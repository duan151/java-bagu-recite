<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题库 - Java 八股</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f3f4f6;
            color: #1f2937;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            padding: 0 20px;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .06);
        }

        .navbar .brand {
            font-size: 17px;
            font-weight: 700;
            color: #4f46e5;
            text-decoration: none;
        }

        .navbar .actions { display: flex; align-items: center; gap: 10px; }

        .btn {
            height: 34px;
            padding: 0 14px;
            font-size: 13px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background .2s, color .2s;
        }

        .btn-primary { color: #fff; background: #4f46e5; }
        .btn-primary:hover { background: #4338ca; }

        .btn-plain { color: #4b5563; background: #fff; border-color: #d1d5db; }
        .btn-plain:hover { background: #f9fafb; }

        /* 右上角设置下拉 */
        .dropdown { position: relative; }

        .icon-btn {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4b5563;
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            transition: background .2s, color .2s;
        }

        .icon-btn:hover { color: #4f46e5; background: #f9fafb; }

        .dropdown-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            min-width: 132px;
            padding: 6px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
            display: none;
            z-index: 20;
        }

        .dropdown:hover .dropdown-menu,
        .dropdown.open .dropdown-menu { display: block; }

        .dropdown-menu a,
        .dropdown-menu button {
            display: block;
            width: 100%;
            padding: 8px 10px;
            font-size: 13px;
            text-align: left;
            color: #374151;
            background: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
        }

        .dropdown-menu a:hover,
        .dropdown-menu button:hover { background: #f3f4f6; color: #4f46e5; }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 22px 16px 40px;
        }

        /* 筛选栏 */
        .toolbar { margin-bottom: 16px; }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .search-box input {
            flex: 1;
            height: 38px;
            padding: 0 12px;
            font-size: 14px;
            color: #1f2937;
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .search-box input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, .15);
        }

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #c7d2fe transparent;
            cursor: grab;
            user-select: none;
        }

        .chips.dragging { cursor: grabbing; }

        .chips::-webkit-scrollbar { height: 4px; }
        .chips::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 2px; }
        .chips::-webkit-scrollbar-track { background: transparent; }

        .chip {
            flex-shrink: 0;
            height: 30px;
            padding: 0 13px;
            font-size: 13px;
            color: #4b5563;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            cursor: pointer;
        }

        .chip:hover { border-color: #c7d2fe; color: #4f46e5; }

        .chip.active {
            color: #fff;
            background: #4f46e5;
            border-color: #4f46e5;
        }

        .btn-random {
            flex-shrink: 0;
            height: 38px;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity .2s;
        }

        .btn-random:hover { opacity: .9; }

        /* 抽题弹窗 */
        .random-modal { max-width: 560px; }

        .section-title {
            margin: 16px 0 8px;
            font-size: 13px;
            font-weight: 600;
            color: #4b5563;
        }

        .section-title:first-child { margin-top: 0; }

        .seg { display: flex; flex-wrap: wrap; gap: 8px; }

        .seg-item {
            height: 30px;
            padding: 0 14px;
            font-size: 13px;
            color: #4b5563;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            cursor: pointer;
            transition: .2s;
        }

        .seg-item:hover { border-color: #c7d2fe; color: #4f46e5; }
        .seg-item.active { color: #fff; background: #4f46e5; border-color: #4f46e5; }

        .type-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
            padding: 2px;
        }

        .type-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            font-size: 13px;
            color: #4b5563;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }

        .type-item input { accent-color: #4f46e5; }
        .type-item:hover { border-color: #c7d2fe; }

        .type-count {
            padding: 0 6px;
            font-size: 11px;
            color: #6b7280;
            background: #f3f4f6;
            border-radius: 999px;
        }

        .random-result h3 {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .random-result .meta { margin-bottom: 12px; }

        .random-answer {
            padding-top: 12px;
            border-top: 1px dashed #e5e7eb;
            font-size: 14px;
            line-height: 1.8;
            color: #374151;
            word-break: break-word;
        }

        .random-answer .desc {
            margin-bottom: 12px;
            padding: 10px 12px;
            font-size: 13px;
            color: #6b7280;
            background: #f9fafb;
            border-radius: 8px;
        }

        .random-answer h1, .random-answer h2, .random-answer h3 { margin: 14px 0 8px; font-size: 15px; }
        .random-answer p { margin: 8px 0; }
        .random-answer ul, .random-answer ol { margin: 8px 0 8px 22px; }
        .random-answer code {
            padding: 1px 5px;
            font-size: 13px;
            background: #f3f4f6;
            border-radius: 4px;
        }
        .random-answer pre {
            margin: 10px 0;
            padding: 12px;
            overflow-x: auto;
            background: #1f2937;
            border-radius: 8px;
        }
        .random-answer pre code { padding: 0; color: #e5e7eb; background: none; }

        .list { display: flex; flex-direction: column; gap: 14px; }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 18px 20px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .05);
        }

        .card-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .head-left {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            min-width: 0;
        }

        .card-head h3 {
            font-size: 16px;
            line-height: 1.5;
            font-weight: 600;
            word-break: break-word;
        }

        .star {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            margin-top: -3px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d1d5db;
            background: none;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: color .2s, background .2s;
        }

        .star:hover { color: #f59e0b; background: #fffbeb; }
        .star.on { color: #f59e0b; }
        .star.on svg { fill: currentColor; }

        .mastery {
            height: 22px;
            padding: 0 10px;
            font-size: 12px;
            color: #6b7280;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            cursor: pointer;
            transition: color .2s, background .2s, border-color .2s;
        }

        .mastery:hover { color: #059669; background: #ecfdf5; border-color: #a7f3d0; }
        .mastery.on { color: #059669; background: #ecfdf5; border-color: #a7f3d0; }

        .ops { display: flex; gap: 6px; flex-shrink: 0; }

        .op {
            height: 28px;
            padding: 0 10px;
            font-size: 12px;
            color: #4b5563;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
        }

        .op:hover { background: #eef2ff; color: #4f46e5; border-color: #c7d2fe; }
        .op.danger:hover { background: #fef2f2; color: #ef4444; border-color: #fecaca; }

        .meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            font-size: 12px;
            color: #9ca3af;
        }

        .tag {
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 12px;
            line-height: 18px;
        }

        .tag.cat { color: #4f46e5; background: #eef2ff; }
        .tag.easy { color: #059669; background: #ecfdf5; }
        .tag.medium { color: #d97706; background: #fffbeb; }
        .tag.hard { color: #dc2626; background: #fef2f2; }

        .toggle {
            margin-top: 12px;
            padding: 0;
            font-size: 13px;
            color: #4f46e5;
            background: none;
            border: none;
            cursor: pointer;
        }

        .toggle:hover { text-decoration: underline; }

        .card-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 12px;
        }

        .card-foot .toggle { margin-top: 0; }

        /* 筛选勾选框：文字 + 方形框 */
        .filters {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 10px;
        }

        .check {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #4b5563;
            cursor: pointer;
            user-select: none;
        }

        .check input {
            position: absolute;
            width: 0;
            height: 0;
            opacity: 0;
        }

        .check .box {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #fff;
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            transition: background .2s, border-color .2s;
        }

        .check:hover .box { border-color: #a5b4fc; }

        .check input:checked + .box {
            background: #4f46e5;
            border-color: #4f46e5;
        }

        .check input:checked + .box::after { content: '✓'; line-height: 1; }

        .answer {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed #e5e7eb;
            font-size: 14px;
            line-height: 1.8;
            color: #374151;
            word-break: break-word;
        }

        .answer .desc {
            margin-bottom: 12px;
            padding: 10px 12px;
            font-size: 13px;
            color: #6b7280;
            background: #f9fafb;
            border-radius: 8px;
        }

        .answer h1, .answer h2, .answer h3 { margin: 14px 0 8px; font-size: 15px; }
        .answer p { margin: 8px 0; }
        .answer ul, .answer ol { margin: 8px 0 8px 22px; }
        .answer code {
            padding: 1px 5px;
            font-size: 13px;
            background: #f3f4f6;
            border-radius: 4px;
        }
        .answer pre {
            margin: 10px 0;
            padding: 12px;
            overflow-x: auto;
            background: #1f2937;
            border-radius: 8px;
        }
        .answer pre code { padding: 0; color: #e5e7eb; background: none; }
        .answer blockquote {
            margin: 10px 0;
            padding: 6px 12px;
            color: #6b7280;
            background: #f9fafb;
            border-left: 3px solid #c7d2fe;
        }

        .load-status {
            padding: 22px 0 8px;
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
        }

        #sentinel { height: 1px; }

        /* 弹窗 */
        .mask {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(17, 24, 39, .45);
        }

        .mask.show { display: flex; }

        .modal {
            width: 100%;
            max-width: 620px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #f3f4f6;
        }

        .modal-head h2 { font-size: 16px; }

        .modal-close {
            width: 30px;
            height: 30px;
            font-size: 18px;
            color: #9ca3af;
            background: none;
            border: none;
            cursor: pointer;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 18px 20px;
        }

        .form-item { margin-bottom: 14px; }

        .form-item label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #4b5563;
        }

        .form-item input,
        .form-item select,
        .form-item textarea {
            width: 100%;
            padding: 9px 11px;
            font-size: 14px;
            font-family: inherit;
            color: #1f2937;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
        }

        .form-item input:focus,
        .form-item select:focus,
        .form-item textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, .15);
        }

        .form-item textarea { resize: vertical; min-height: 90px; line-height: 1.6; }

        .form-row { display: flex; gap: 12px; }
        .form-row .form-item { flex: 1; }

        .modal-foot {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 14px 20px;
            border-top: 1px solid #f3f4f6;
        }

        /* 提示 */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translate(-50%, -80px);
            z-index: 99;
            padding: 11px 22px;
            font-size: 14px;
            color: #fff;
            background: #10b981;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(16, 185, 129, .3);
            opacity: 0;
            transition: transform .3s, opacity .3s;
            pointer-events: none;
        }

        .toast.show { transform: translate(-50%, 0); opacity: 1; }
        .toast.error { background: #ef4444; box-shadow: 0 8px 20px rgba(239, 68, 68, .3); }

        @media (max-width: 480px) {
            .navbar { padding: 0 14px; }
            .container { padding: 16px 12px 32px; }
            .card { padding: 15px 14px; }
            .form-row { flex-direction: column; gap: 0; }
            .ops .op { padding: 0 8px; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <a class="brand" href="/">Java 八股</a>
    <div class="actions">
        <a class="btn btn-plain" href="/">首页</a>
        <button class="btn btn-primary" id="addBtn">新增题目</button>
        <div class="dropdown" id="settingsDropdown">
            <button class="icon-btn" id="settingsBtn" type="button" title="设置" aria-label="设置">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
            <div class="dropdown-menu">
                <a href="/bagu?starred=1">我的收藏</a>
                <a href="/profile">个人中心</a>
                <button type="button" id="logoutBtn">退出登录</button>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div class="toolbar">
        <div class="search-box">
            <input id="keyword" type="search" placeholder="搜索题目关键词...">
            <button class="btn-random" id="randomBtn" type="button" style="display:none;">随机抽题</button>
        </div>
        <div class="chips" id="chips"></div>
        <div class="filters">
            <label class="check" id="starredFilterWrap">
                已收藏
                <input type="checkbox" id="filterStarred">
                <span class="box"></span>
            </label>
            <label class="check">
                已掌握
                <input type="checkbox" id="filterMastered">
                <span class="box"></span>
            </label>
        </div>
    </div>

    <div class="list" id="list"></div>
    <div class="load-status" id="loadStatus">加载中...</div>
    <div id="sentinel"></div>
</div>

<!-- 新增 / 编辑弹窗 -->
<div class="mask" id="mask">
    <div class="modal">
        <div class="modal-head">
            <h2 id="modalTitle">新增题目</h2>
            <button class="modal-close" id="closeBtn" type="button">×</button>
        </div>
        <form id="questionForm">
            <div class="modal-body">
                <input type="hidden" id="questionId">
                <div class="form-item">
                    <label for="title">题目 *</label>
                    <input id="title" name="title" type="text" placeholder="例如：HashMap 的底层结构是什么？">
                </div>
                <div class="form-row">
                    <div class="form-item">
                        <label for="categoryId">分类</label>
                        <select id="categoryId" name="categoryId">
                            <option value="0">未分类</option>
                        </select>
                    </div>
                    <div class="form-item">
                        <label for="difficulty">难度</label>
                        <select id="difficulty" name="difficulty">
                            <option value="1">简单</option>
                            <option value="2" selected>中等</option>
                            <option value="3">困难</option>
                        </select>
                    </div>
                </div>
                <div class="form-item">
                    <label for="contentMd">题目补充说明（可选，支持 Markdown）</label>
                    <textarea id="contentMd" name="contentMd" placeholder="题目背景、场景描述等"></textarea>
                </div>
                <div class="form-item">
                    <label for="answerMd">答案（支持 Markdown）</label>
                    <textarea id="answerMd" name="answerMd" placeholder="支持 Markdown，如：&#10;- 要点一&#10;- 要点二&#10;&#10;```java&#10;// 代码示例&#10;```"></textarea>
                </div>
            </div>
            <div class="modal-foot">
                <button class="btn btn-plain" type="button" id="cancelBtn">取消</button>
                <button class="btn btn-primary" type="submit" id="saveBtn">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- 随机抽题弹窗 -->
<div class="mask" id="randomMask">
    <div class="modal random-modal">
        <div class="modal-head">
            <h2>随机抽题</h2>
            <button class="modal-close" id="randomCloseBtn" type="button">×</button>
        </div>
        <div class="modal-body">
            <!-- 条件视图 -->
            <div id="randomCondition">
                <div class="section-title">难度</div>
                <div class="seg" id="difficultySeg">
                    <button class="seg-item active" data-value="0" type="button">全部</button>
                    <button class="seg-item" data-value="1" type="button">简单</button>
                    <button class="seg-item" data-value="2" type="button">中等</button>
                    <button class="seg-item" data-value="3" type="button">困难</button>
                </div>

                <div class="section-title">类型（可多选，不选表示全部）</div>
                <div class="type-list" id="typeList"></div>

                <div class="section-title">掌握状态</div>
                <div class="seg" id="masteredSeg">
                    <button class="seg-item active" data-value="0" type="button">全部</button>
                    <button class="seg-item" data-value="1" type="button">已掌握</button>
                    <button class="seg-item" data-value="-1" type="button">未掌握</button>
                </div>

                <div id="starredSegWrap">
                    <div class="section-title">收藏状态</div>
                    <div class="seg" id="starredSeg">
                        <button class="seg-item active" data-value="0" type="button">全部</button>
                        <button class="seg-item" data-value="1" type="button">已收藏</button>
                        <button class="seg-item" data-value="-1" type="button">未收藏</button>
                    </div>
                </div>
            </div>

            <!-- 抽题结果 -->
            <div id="randomResult" class="random-result" hidden>
                <h3 id="randomTitle"></h3>
                <div class="meta" id="randomMeta"></div>
                <div class="random-answer" id="randomAnswer"></div>
            </div>
        </div>
        <div class="modal-foot">
            <button class="btn btn-plain" id="randomBackBtn" type="button" style="display:none;">修改条件</button>
            <button class="btn btn-plain" id="randomAgainBtn" type="button" style="display:none;">再抽一题</button>
            <button class="btn btn-primary" id="randomDrawBtn" type="button">开始抽题</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/marked.min.js"></script>
<script>
    const state = {
        lastId: 0,
        size: 10,
        loading: false,
        finished: false,
        categories: [],
        categoryId: 0,
        keyword: '',
        starred: 0,
        mastered: 0
    };

    // 支持 /bagu?starred=1（我的收藏）、?mastered=1 等初始筛选
    (function initFiltersFromUrl() {
        const params = new URLSearchParams(location.search);
        state.categoryId = Number(params.get('categoryId')) || 0;
        state.keyword = params.get('keyword') || '';
        state.starred = params.get('starred') === '1' ? 1 : 0;
        state.mastered = params.get('mastered') === '1' ? 1 : 0;
        if (state.starred === 1) {
            document.title = '我的收藏 - Java 八股';
        }
    })();

    // 收藏页的随机抽题只能抽已收藏的题
    const isFavoritesPage = state.starred === 1;

    const listEl = document.getElementById('list');
    const statusEl = document.getElementById('loadStatus');
    const sentinel = document.getElementById('sentinel');
    const mask = document.getElementById('mask');
    const modalTitle = document.getElementById('modalTitle');
    const form = document.getElementById('questionForm');
    const toast = document.getElementById('toast');

    function escapeHtml(text) {
        return String(text == null ? '' : text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function renderMarkdown(text) {
        if (!text) return '';
        // breaks: true —— 普通文本里直接回车也会换行，符合不用 Markdown 时的习惯
        if (window.marked) return marked.parse(text, { breaks: true, gfm: true });
        return escapeHtml(text).replace(/\n/g, '<br>');
    }

    function categoryName(id) {
        const category = state.categories.find(function (c) { return Number(c.id) === Number(id); });
        return category ? category.name : '未分类';
    }

    function difficultyInfo(difficulty) {
        const map = {
            1: ['简单', 'easy'],
            2: ['中等', 'medium'],
            3: ['困难', 'hard']
        };
        return map[difficulty] || map[2];
    }

    function showToast(text, isError) {
        toast.textContent = text;
        toast.className = 'toast show' + (isError ? ' error' : '');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(function () {
            toast.classList.remove('show');
        }, 2000);
    }

    async function api(url, options) {
        const resp = await fetch(url, options);
        const data = await resp.json();
        if (data.code === '0005') {
            location.href = '/login';
            throw new Error('未登录');
        }
        return data;
    }

    const STAR_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" ' +
        'stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.6l2.47 5.01 5.53.8-4 3.9.94 5.5L12 16.2l-4.94 2.6.94-5.5-4-3.9 5.53-.8z"/></svg>';

    function cardElement(question) {
        const info = difficultyInfo(question.difficulty);
        const starred = Number(question.starred) === 1;
        const mastered = Number(question.mastered) === 1;
        const div = document.createElement('div');
        div.className = 'card';
        div.dataset.id = question.id;
        div.innerHTML =
            '<div class="card-head">' +
                '<div class="head-left">' +
                    '<button class="star' + (starred ? ' on' : '') + '" data-act="star" type="button" ' +
                        'title="' + (starred ? '取消收藏' : '收藏') + '" aria-label="' + (starred ? '取消收藏' : '收藏') + '">' +
                        STAR_SVG +
                    '</button>' +
                    '<h3>' + escapeHtml(question.title) + '</h3>' +
                '</div>' +
                '<div class="ops">' +
                    '<button class="op" data-act="edit" type="button">编辑</button>' +
                    '<button class="op danger" data-act="delete" type="button">删除</button>' +
                '</div>' +
            '</div>' +
            '<div class="meta">' +
                '<span class="tag cat">' + escapeHtml(categoryName(question.categoryId)) + '</span>' +
                '<span class="tag ' + info[1] + '">' + info[0] + '</span>' +
                '<span class="time">' + (question.createTime || '').replace('T', ' ').slice(0, 16) + '</span>' +
            '</div>' +
            '<div class="answer" hidden></div>' +
            '<div class="card-foot">' +
                '<button class="toggle" data-act="toggle" type="button">查看答案</button>' +
                '<button class="mastery' + (mastered ? ' on' : '') + '" data-act="mastery" type="button">' +
                    (mastered ? '已掌握' : '标记掌握') +
                '</button>' +
            '</div>';
        return div;
    }

    async function loadMore() {
        if (state.loading || state.finished) return;
        state.loading = true;
        statusEl.textContent = '加载中...';

        try {
            let url = '/bagu/list?lastId=' + state.lastId + '&size=' + state.size;
            if (state.categoryId > 0) url += '&categoryId=' + state.categoryId;
            if (state.keyword) url += '&keyword=' + encodeURIComponent(state.keyword);
            if (state.starred === 1) url += '&starred=1';
            if (state.mastered === 1) url += '&mastered=1';
            const result = await api(url);
            if (result.code !== '0000') {
                statusEl.textContent = result.info || '加载失败';
                return;
            }
            const list = result.data || [];
            if (list.length === 0) {
                state.finished = true;
                const hasFilter = state.categoryId > 0 || state.keyword !== ''
                    || state.starred === 1 || state.mastered === 1;
                let emptyText = '还没有题目，点右上角「新增题目」添加';
                if (state.starred === 1 && state.mastered === 1) {
                    emptyText = '没有已掌握的收藏题目';
                } else if (state.starred === 1) {
                    emptyText = '还没有收藏的题目，点题目左侧的星标即可收藏';
                } else if (state.mastered === 1) {
                    emptyText = '还没有标记为已掌握的题目';
                } else if (hasFilter) {
                    emptyText = '没有符合条件的题目';
                }
                statusEl.textContent = state.lastId === 0 ? emptyText : '没有更多了';
                return;
            }

            const fragment = document.createDocumentFragment();
            list.forEach(function (question) {
                fragment.appendChild(cardElement(question));
            });
            listEl.appendChild(fragment);

            state.lastId = list[list.length - 1].id;
            if (list.length < state.size) {
                state.finished = true;
                statusEl.textContent = '没有更多了';
            } else {
                statusEl.textContent = '';
            }
        } catch (e) {
            statusEl.textContent = '网络异常，请稍后重试';
        } finally {
            state.loading = false;
        }
    }

    async function toggleAnswer(card, id, button) {
        const answerEl = card.querySelector('.answer');
        if (answerEl.dataset.loaded === '1') {
            answerEl.hidden = !answerEl.hidden;
            button.textContent = answerEl.hidden ? '查看答案' : '收起答案';
            return;
        }

        button.disabled = true;
        button.textContent = '加载中...';
        try {
            const result = await api('/bagu/detail?id=' + id);
            if (result.code !== '0000') {
                showToast(result.info || '加载失败', true);
                button.textContent = '查看答案';
                return;
            }
            const question = result.data;
            answerEl.innerHTML =
                (question.contentMd ? '<div class="desc">' + renderMarkdown(question.contentMd) + '</div>' : '') +
                '<div>' + renderMarkdown(question.answerMd) + '</div>';
            answerEl.dataset.loaded = '1';
            answerEl.hidden = false;
            button.textContent = '收起答案';
        } catch (e) {
            button.textContent = '查看答案';
        } finally {
            button.disabled = false;
        }
    }

    async function removeQuestion(id, card) {
        if (!confirm('确定删除这道题吗？')) return;
        const body = new URLSearchParams({ id: id });
        const result = await api('/bagu/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
            body: body
        });
        if (result.code === '0000') {
            card.remove();
            showToast('删除成功');
        } else {
            showToast(result.info || '删除失败', true);
        }
    }

    function setStarState(button, on) {
        button.classList.toggle('on', on);
        const text = on ? '取消收藏' : '收藏';
        button.title = text;
        button.setAttribute('aria-label', text);
    }

    function setMasteryState(button, on) {
        button.classList.toggle('on', on);
        button.textContent = on ? '已掌握' : '标记掌握';
    }

    async function markQuestion(id, field, value, rollback) {
        try {
            const body = new URLSearchParams({ id: id });
            body.append(field, String(value));
            const result = await api('/bagu/mark', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body: body
            });
            if (result.code !== '0000') {
                rollback();
                showToast(result.info || '操作失败', true);
            }
        } catch (e) {
            rollback();
            showToast('网络异常，请稍后重试', true);
        }
    }

    function toggleStar(id, button) {
        // 先改界面再发请求，失败时回滚
        const next = button.classList.contains('on') ? 0 : 1;
        setStarState(button, next === 1);
        markQuestion(id, 'starred', next, function () {
            setStarState(button, next !== 1);
        });
    }

    function toggleMastery(id, button) {
        const next = button.classList.contains('on') ? 0 : 1;
        setMasteryState(button, next === 1);
        markQuestion(id, 'mastered', next, function () {
            setMasteryState(button, next !== 1);
        });
    }

    function openModal(title) {
        modalTitle.textContent = title;
        mask.classList.add('show');
    }

    function closeModal() {
        mask.classList.remove('show');
        form.reset();
        document.getElementById('questionId').value = '';
    }

    function openAdd() {
        form.reset();
        document.getElementById('questionId').value = '';
        document.getElementById('difficulty').value = '2';
        openModal('新增题目');
    }

    async function openEdit(id) {
        const result = await api('/bagu/detail?id=' + id);
        if (result.code !== '0000') {
            showToast(result.info || '加载失败', true);
            return;
        }
        const question = result.data;
        document.getElementById('questionId').value = question.id;
        document.getElementById('title').value = question.title || '';
        document.getElementById('categoryId').value = String(question.categoryId || 0);
        document.getElementById('difficulty').value = String(question.difficulty || 2);
        document.getElementById('contentMd').value = question.contentMd || '';
        document.getElementById('answerMd').value = question.answerMd || '';
        openModal('编辑题目');
    }

    async function loadCategories() {
        const result = await api('/bagu/categories');
        if (result.code !== '0000') return;
        state.categories = result.data || [];
        const select = document.getElementById('categoryId');
        select.innerHTML = '<option value="0">未分类</option>' +
            state.categories.map(function (category) {
                return '<option value="' + category.id + '">' + escapeHtml(category.name) + '</option>';
            }).join('');
        renderChips();
    }

    function renderChips() {
        const chips = document.getElementById('chips');
        chips.innerHTML = '';

        const all = document.createElement('button');
        all.type = 'button';
        all.className = 'chip' + (state.categoryId === 0 ? ' active' : '');
        all.textContent = '全部';
        all.addEventListener('click', function () { selectCategory(0); });
        chips.appendChild(all);

        state.categories.forEach(function (category) {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'chip' + (Number(state.categoryId) === Number(category.id) ? ' active' : '');
            chip.textContent = category.name;
            chip.addEventListener('click', function () { selectCategory(Number(category.id)); });
            chips.appendChild(chip);
        });
    }

    function selectCategory(categoryId) {
        state.categoryId = categoryId;
        renderChips();
        resetList();
    }

    function syncUrl() {
        const params = new URLSearchParams();
        if (state.categoryId > 0) params.set('categoryId', state.categoryId);
        if (state.keyword) params.set('keyword', state.keyword);
        if (state.starred === 1) params.set('starred', '1');
        if (state.mastered === 1) params.set('mastered', '1');
        const query = params.toString();
        history.replaceState(null, '', location.pathname + (query ? '?' + query : ''));
    }

    function resetList() {
        syncUrl();
        state.lastId = 0;
        state.finished = false;
        state.loading = false;
        listEl.innerHTML = '';
        statusEl.textContent = '加载中...';
        loadMore();
    }

    listEl.addEventListener('click', function (event) {
        const button = event.target.closest('button');
        if (!button) return;
        const card = event.target.closest('.card');
        if (!card) return;
        const id = card.dataset.id;

        if (button.dataset.act === 'toggle') toggleAnswer(card, id, button);
        if (button.dataset.act === 'star') toggleStar(id, button);
        if (button.dataset.act === 'mastery') toggleMastery(id, button);
        if (button.dataset.act === 'edit') openEdit(id);
        if (button.dataset.act === 'delete') removeQuestion(id, card);
    });

    document.getElementById('addBtn').addEventListener('click', openAdd);
    document.getElementById('closeBtn').addEventListener('click', closeModal);
    document.getElementById('cancelBtn').addEventListener('click', closeModal);

    // 右上角设置：悬停显示，点击也可以切换（兼容触屏）
    const settingsDropdown = document.getElementById('settingsDropdown');
    document.getElementById('settingsBtn').addEventListener('click', function (event) {
        event.stopPropagation();
        settingsDropdown.classList.toggle('open');
    });
    document.addEventListener('click', function () {
        settingsDropdown.classList.remove('open');
    });

    document.getElementById('logoutBtn').addEventListener('click', async function () {
        try {
            await fetch('/login/logout', { method: 'POST' });
        } catch (e) {
            // ignore
        }
        localStorage.removeItem('token');
        document.cookie = 'token=; path=/; max-age=0';
        location.href = '/login';
    });

    // 搜索框防抖：输入停止 300ms 后查询
    const keywordInput = document.getElementById('keyword');
    let searchTimer = null;
    keywordInput.addEventListener('input', function () {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
            const value = keywordInput.value.trim();
            if (value === state.keyword) return;
            state.keyword = value;
            resetList();
        }, 300);
    });

    // 分类栏：桌面端支持鼠标滚轮左右滑动 + 按住拖动
    const chipsEl = document.getElementById('chips');
    let chipsDragging = false;
    let chipsMoved = false;
    let chipsStartX = 0;
    let chipsStartScroll = 0;

    chipsEl.addEventListener('wheel', function (event) {
        if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
            chipsEl.scrollLeft += event.deltaY;
            event.preventDefault();
        }
    }, { passive: false });

    chipsEl.addEventListener('mousedown', function (event) {
        if (event.button !== 0) return;
        chipsDragging = true;
        chipsMoved = false;
        chipsStartX = event.pageX;
        chipsStartScroll = chipsEl.scrollLeft;
        chipsEl.classList.add('dragging');
    });

    window.addEventListener('mousemove', function (event) {
        if (!chipsDragging) return;
        const distance = event.pageX - chipsStartX;
        if (Math.abs(distance) > 5) chipsMoved = true;
        chipsEl.scrollLeft = chipsStartScroll - distance;
    });

    window.addEventListener('mouseup', function () {
        chipsDragging = false;
        chipsEl.classList.remove('dragging');
    });

    // 拖动后松手不要误触分类切换
    chipsEl.addEventListener('click', function (event) {
        if (chipsMoved) {
            event.stopPropagation();
            event.preventDefault();
            chipsMoved = false;
        }
    }, true);

    // 筛选：已收藏 / 已掌握
    document.getElementById('filterStarred').addEventListener('change', function (event) {
        state.starred = event.target.checked ? 1 : 0;
        document.title = state.starred === 1 ? '我的收藏 - Java 八股' : '题库 - Java 八股';
        resetList();
    });

    document.getElementById('filterMastered').addEventListener('change', function (event) {
        state.mastered = event.target.checked ? 1 : 0;
        resetList();
    });

    form.addEventListener('submit', async function (event) {
        event.preventDefault();
        const id = document.getElementById('questionId').value;
        const title = document.getElementById('title').value.trim();
        if (!title) {
            showToast('题目不能为空', true);
            return;
        }
        const isEdit = !!id;
        const body = new URLSearchParams({
            title: title,
            categoryId: document.getElementById('categoryId').value || '0',
            difficulty: document.getElementById('difficulty').value || '2',
            contentMd: document.getElementById('contentMd').value,
            answerMd: document.getElementById('answerMd').value
        });
        if (isEdit) body.append('id', id);

        const saveBtn = document.getElementById('saveBtn');
        saveBtn.disabled = true;
        saveBtn.textContent = '保存中...';
        try {
            const result = await api(isEdit ? '/bagu/update' : '/bagu/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body: body
            });
            if (result.code === '0000') {
                closeModal();
                showToast(isEdit ? '修改成功' : '新增成功');
                resetList();
            } else {
                showToast(result.info || '保存失败', true);
            }
        } catch (e) {
            showToast('网络异常，请稍后重试', true);
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = '保存';
        }
    });

    new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) loadMore();
    }, { rootMargin: '200px' }).observe(sentinel);

    // ===== 随机抽题 =====
    const randomState = {
        difficulty: 0,
        mastered: 0,
        starred: 0,
        categoryIds: new Set(),
        options: []
    };

    const randomMask = document.getElementById('randomMask');
    const typeListEl = document.getElementById('typeList');

    function openRandom() {
        // 收藏页：固定只从已收藏的题里抽，隐藏「收藏状态」选择
        if (isFavoritesPage) {
            randomState.starred = 1;
            document.getElementById('starredSegWrap').hidden = true;
        }
        randomMask.classList.add('show');
        showRandomCondition();
        loadRandomOptions();
    }

    function closeRandom() {
        randomMask.classList.remove('show');
    }

    function showRandomCondition() {
        document.getElementById('randomCondition').hidden = false;
        document.getElementById('randomResult').hidden = true;
        document.getElementById('randomDrawBtn').style.display = '';
        document.getElementById('randomAgainBtn').style.display = 'none';
        document.getElementById('randomBackBtn').style.display = 'none';
    }

    async function loadRandomOptions() {
        const params = new URLSearchParams({
            difficulty: String(randomState.difficulty),
            mastered: String(randomState.mastered),
            starred: String(randomState.starred)
        });
        try {
            const result = await api('/bagu/random/options?' + params.toString());
            if (result.code !== '0000') {
                showToast(result.info || '加载失败', true);
                return;
            }
            randomState.options = result.data || [];
            // 去掉已经不在当前结果里的分类选择
            const ids = new Set(randomState.options.map(function (option) { return Number(option.id); }));
            Array.from(randomState.categoryIds).forEach(function (id) {
                if (!ids.has(id)) randomState.categoryIds.delete(id);
            });
            renderTypeList();
            updateDrawButton();
        } catch (e) {
            showToast('网络异常，请稍后重试', true);
        }
    }

    function renderTypeList() {
        if (randomState.options.length === 0) {
            typeListEl.innerHTML = '<span style="font-size:13px;color:#9ca3af;">当前条件下没有题目</span>';
            return;
        }
        typeListEl.innerHTML = randomState.options.map(function (option) {
            const checked = randomState.categoryIds.has(Number(option.id)) ? ' checked' : '';
            return '<label class="type-item">' +
                '<input type="checkbox" value="' + option.id + '"' + checked + '>' +
                '<span>' + escapeHtml(option.name) + '</span>' +
                '<span class="type-count">' + option.count + '</span>' +
                '</label>';
        }).join('');
    }

    function updateDrawButton() {
        let total = 0;
        randomState.options.forEach(function (option) {
            if (randomState.categoryIds.size === 0 || randomState.categoryIds.has(Number(option.id))) {
                total += Number(option.count);
            }
        });
        const button = document.getElementById('randomDrawBtn');
        button.textContent = total > 0 ? '开始抽题（共 ' + total + ' 题）' : '没有符合条件的题目';
        button.disabled = total === 0;
    }

    async function drawRandom() {
        const drawButton = document.getElementById('randomDrawBtn');
        drawButton.disabled = true;
        drawButton.textContent = '抽题中...';

        const params = new URLSearchParams({
            difficulty: String(randomState.difficulty),
            mastered: String(randomState.mastered),
            starred: String(randomState.starred)
        });
        randomState.categoryIds.forEach(function (id) { params.append('categoryIds', id); });

        try {
            const result = await api('/bagu/random?' + params.toString());
            if (result.code !== '0000') {
                showToast(result.info || '抽题失败', true);
                updateDrawButton();
                return;
            }
            showRandomResult(result.data);
        } catch (e) {
            showToast('网络异常，请稍后重试', true);
            updateDrawButton();
        }
    }

    function showRandomResult(question) {
        document.getElementById('randomCondition').hidden = true;
        document.getElementById('randomResult').hidden = false;
        document.getElementById('randomTitle').textContent = question.title;

        const info = difficultyInfo(question.difficulty);
        const starred = Number(question.starred) === 1;
        const mastered = Number(question.mastered) === 1;
        document.getElementById('randomMeta').innerHTML =
            '<span class="tag cat">' + escapeHtml(categoryName(question.categoryId)) + '</span>' +
            '<span class="tag ' + info[1] + '">' + info[0] + '</span>' +
            '<span class="tag ' + (starred ? 'easy' : 'medium') + '">' + (starred ? '已收藏' : '未收藏') + '</span>' +
            '<span class="tag ' + (mastered ? 'easy' : 'medium') + '">' + (mastered ? '已掌握' : '未掌握') + '</span>';

        document.getElementById('randomAnswer').innerHTML =
            (question.contentMd ? '<div class="desc">' + renderMarkdown(question.contentMd) + '</div>' : '') +
            '<div>' + renderMarkdown(question.answerMd) + '</div>';

        document.getElementById('randomDrawBtn').style.display = 'none';
        document.getElementById('randomAgainBtn').style.display = '';
        document.getElementById('randomBackBtn').style.display = '';
    }

    function bindSeg(id, field) {
        const container = document.getElementById(id);
        container.addEventListener('click', function (event) {
            const button = event.target.closest('.seg-item');
            if (!button) return;
            container.querySelectorAll('.seg-item').forEach(function (item) {
                item.classList.remove('active');
            });
            button.classList.add('active');
            randomState[field] = Number(button.dataset.value);
            loadRandomOptions();
        });
    }

    bindSeg('difficultySeg', 'difficulty');
    bindSeg('masteredSeg', 'mastered');
    bindSeg('starredSeg', 'starred');

    typeListEl.addEventListener('change', function (event) {
        if (!event.target.matches('input[type="checkbox"]')) return;
        const id = Number(event.target.value);
        if (event.target.checked) {
            randomState.categoryIds.add(id);
        } else {
            randomState.categoryIds.delete(id);
        }
        updateDrawButton();
    });

    document.getElementById('randomBtn').addEventListener('click', openRandom);
    document.getElementById('randomCloseBtn').addEventListener('click', closeRandom);
    document.getElementById('randomDrawBtn').addEventListener('click', drawRandom);
    document.getElementById('randomAgainBtn').addEventListener('click', drawRandom);
    document.getElementById('randomBackBtn').addEventListener('click', function () {
        showRandomCondition();
        loadRandomOptions();
    });

    (async function init() {
        keywordInput.value = state.keyword;
        document.getElementById('filterStarred').checked = state.starred === 1;
        document.getElementById('filterMastered').checked = state.mastered === 1;

        // 题库页：显示分类栏，不显示随机抽题；收藏页：隐藏分类栏，显示随机抽题
        if (isFavoritesPage) {
            document.getElementById('chips').style.display = 'none';
            document.getElementById('randomBtn').style.display = '';
            document.getElementById('starredFilterWrap').style.display = 'none';
        }

        await loadCategories();
        await loadMore();
    })();
</script>

</body>
</html>
