<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - Java 八股</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f3f4f6;
            color: #1f2937;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            padding: 0 20px;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .06);
        }

        .navbar .brand {
            font-size: 17px;
            font-weight: 700;
            color: #4f46e5;
        }

        .navbar .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 6px;
            border-radius: 50%;
            background: #9ca3af;
            vertical-align: middle;
        }

        .status-dot.online { background: #10b981; }

        .btn {
            height: 34px;
            padding: 0 14px;
            font-size: 13px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background .2s, color .2s;
        }

        .btn-primary {
            color: #fff;
            background: #4f46e5;
        }

        .btn-primary:hover { background: #4338ca; }

        .btn-plain {
            color: #4b5563;
            background: #fff;
            border-color: #d1d5db;
        }

        .btn-plain:hover { background: #f9fafb; }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 28px 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .05);
        }

        .card h1 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            line-height: 1.8;
            color: #6b7280;
        }

        .tag {
            display: inline-block;
            margin: 18px 8px 0 0;
            padding: 6px 12px;
            font-size: 12px;
            color: #4f46e5;
            background: #eef2ff;
            border-radius: 999px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="brand">Java 八股</div>
    <div class="actions">
        <span id="loginState"><span class="status-dot"></span>未登录</span>
        <a class="btn btn-plain" href="/bagu">题库</a>
        <a class="btn btn-primary" id="loginLink" href="/login">去登录</a>
        <button class="btn btn-plain" id="logoutBtn" style="display:none;">退出登录</button>
    </div>
</div>

<div class="container">
    <div class="card">
        <h1>欢迎回来</h1>
        <p>
            这是你的个人 Java 八股刷题网站。<br>
            登录成功后 token 已保存在浏览器 localStorage 中，后续请求会带上它。
        </p>
        <div>
            <span class="tag">题目列表开发中</span>
            <span class="tag">分类筛选 / 搜索</span>
            <span class="tag">签到打卡</span>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    const loginState = document.getElementById('loginState');
    const loginLink = document.getElementById('loginLink');
    const logoutBtn = document.getElementById('logoutBtn');

    if (token) {
        loginState.innerHTML = '<span class="status-dot online"></span>已登录';
        loginLink.style.display = 'none';
        logoutBtn.style.display = 'inline-flex';
    }

    logoutBtn.addEventListener('click', async function () {
        // 先通知后端删除 Redis 中的 token，失败也继续清理本地
        try {
            await fetch('/login/logout', { method: 'POST' });
        } catch (e) {
            // ignore
        }
        localStorage.removeItem('token');
        // 同时清掉后端校验用的 Cookie
        document.cookie = 'token=; path=/; max-age=0';
        location.href = '/login';
    });
</script>

</body>
</html>
