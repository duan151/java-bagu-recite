<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - Java 八股</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f3f4f6;
            color: #1f2937;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            padding: 0 20px;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .06);
        }

        .navbar .brand {
            font-size: 17px;
            font-weight: 700;
            color: #4f46e5;
        }

        .navbar .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 6px;
            border-radius: 50%;
            background: #9ca3af;
            vertical-align: middle;
        }

        .status-dot.online { background: #10b981; }

        .btn {
            height: 34px;
            padding: 0 14px;
            font-size: 13px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background .2s, color .2s;
        }

        .btn-primary {
            color: #fff;
            background: #4f46e5;
        }

        .btn-primary:hover { background: #4338ca; }

        .btn-plain {
            color: #4b5563;
            background: #fff;
            border-color: #d1d5db;
        }

        .btn-plain:hover { background: #f9fafb; }

        /* 右上角设置下拉 */
        .dropdown { position: relative; }

        .icon-btn {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4b5563;
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            transition: background .2s, color .2s;
        }

        .icon-btn:hover { color: #4f46e5; background: #f9fafb; }

        .dropdown-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            min-width: 132px;
            padding: 6px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
            display: none;
            z-index: 20;
        }

        .dropdown:hover .dropdown-menu,
        .dropdown.open .dropdown-menu { display: block; }

        .dropdown-menu a,
        .dropdown-menu button {
            display: block;
            width: 100%;
            padding: 8px 10px;
            font-size: 13px;
            text-align: left;
            color: #374151;
            background: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
        }

        .dropdown-menu a:hover,
        .dropdown-menu button:hover { background: #f3f4f6; color: #4f46e5; }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 28px 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .05);
        }

        .card h1 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            line-height: 1.8;
            color: #6b7280;
        }

        .tag {
            display: inline-block;
            margin: 18px 8px 0 0;
            padding: 6px 12px;
            font-size: 12px;
            color: #4f46e5;
            background: #eef2ff;
            border-radius: 999px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="brand">Java 八股</div>
    <div class="actions">
        <span id="loginState"><span class="status-dot"></span>未登录</span>
        <a class="btn btn-plain" href="/bagu">题库</a>
        <a class="btn btn-primary" id="loginLink" href="/login">去登录</a>
        <div class="dropdown" id="settingsDropdown">
            <button class="icon-btn" id="settingsBtn" type="button" title="设置" aria-label="设置">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
            <div class="dropdown-menu">
                <a href="/bagu?starred=1">我的收藏</a>
                <a href="/profile">个人中心</a>
                <button type="button" id="logoutBtn">退出登录</button>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div class="card">
        <h1>欢迎回来</h1>
        <p>
            这是你的个人 Java 八股刷题网站。<br>
            登录成功后 token 已保存在浏览器 localStorage 中，后续请求会带上它。
        </p>
        <div>
            <span class="tag">题目列表开发中</span>
            <span class="tag">分类筛选 / 搜索</span>
            <span class="tag">签到打卡</span>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    const loginState = document.getElementById('loginState');
    const loginLink = document.getElementById('loginLink');

    if (token) {
        loginState.innerHTML = '<span class="status-dot online"></span>已登录';
        loginLink.style.display = 'none';
    }

    // 设置下拉：悬停显示，点击也可以切换（兼容触屏）
    const settingsDropdown = document.getElementById('settingsDropdown');
    document.getElementById('settingsBtn').addEventListener('click', function (event) {
        event.stopPropagation();
        settingsDropdown.classList.toggle('open');
    });
    document.addEventListener('click', function () {
        settingsDropdown.classList.remove('open');
    });

    document.getElementById('logoutBtn').addEventListener('click', async function () {
        // 先通知后端删除 Redis 中的 token，失败也继续清理本地
        try {
            await fetch('/login/logout', { method: 'POST' });
        } catch (e) {
            // ignore
        }
        localStorage.removeItem('token');
        // 同时清掉后端校验用的 Cookie
        document.cookie = 'token=; path=/; max-age=0';
        location.href = '/login';
    });
</script>

</body>
</html>
