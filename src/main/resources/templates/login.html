<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Java 八股</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: 16px;
            padding: 36px 28px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .18);
        }

        .login-card h1 {
            font-size: 22px;
            color: #1f2937;
            text-align: center;
            margin-bottom: 6px;
        }

        .login-card .subtitle {
            font-size: 13px;
            color: #9ca3af;
            text-align: center;
            margin-bottom: 26px;
        }

        .form-item { margin-bottom: 16px; }

        .form-item label {
            display: block;
            font-size: 13px;
            color: #4b5563;
            margin-bottom: 6px;
        }

        .form-item input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            font-size: 15px;
            color: #1f2937;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .form-item input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, .15);
        }

        .error-msg {
            min-height: 18px;
            font-size: 13px;
            color: #ef4444;
            margin-bottom: 8px;
        }

        .btn-login {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: opacity .2s;
        }

        .btn-login:hover { opacity: .9; }
        .btn-login:disabled { opacity: .6; cursor: not-allowed; }

        /* 成功提示 */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translate(-50%, -80px);
            padding: 12px 22px;
            font-size: 14px;
            color: #fff;
            background: #10b981;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(16, 185, 129, .35);
            opacity: 0;
            transition: transform .3s ease, opacity .3s ease;
            pointer-events: none;
        }

        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        @media (max-width: 480px) {
            .login-card { padding: 28px 20px 24px; }
        }
    </style>
</head>
<body>

<div class="login-card">
    <h1>Java 八股</h1>
    <p class="subtitle">登录后开始刷题</p>

    <form id="loginForm" novalidate>
        <div class="form-item">
            <label for="username">账号</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号">
        </div>
        <div class="form-item">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">
        </div>

        <div class="error-msg" id="errorMsg"></div>
        <button class="btn-login" id="submitBtn" type="submit">登 录</button>
    </form>
</div>

<div class="toast" id="toast">登录成功</div>

<script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');
    const toast = document.getElementById('toast');

    function showToast(text) {
        toast.textContent = text;
        toast.classList.add('show');
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorMsg.textContent = '';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
            errorMsg.textContent = '请输入账号和密码';
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '登录中...';

        try {
            const resp = await fetch('/login/checkUser', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body: new URLSearchParams({ username: username, password: password })
            });
            const result = await resp.json();

            if (result.code === '0000') {
                // 存 token：localStorage 给前端用，Cookie 给后端拦截器校验用
                localStorage.setItem('token', result.data);
                document.cookie = 'token=' + result.data + '; path=/; max-age=' + (7 * 24 * 3600) + '; SameSite=Lax';
                showToast('登录成功');
                // 稍等一下让提示可见，再跳转首页
                setTimeout(function () {
                    location.href = '/';
                }, 1200);
                return;
            }

            errorMsg.textContent = result.info || '登录失败';
        } catch (err) {
            errorMsg.textContent = '网络异常，请稍后重试';
        }

        submitBtn.disabled = false;
        submitBtn.textContent = '登 录';
    });
</script>

</body>
</html>
